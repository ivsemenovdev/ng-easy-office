<section class="regions-section">
    <tui-accordion>
          <button [tuiAccordion]="false">
            Субъекты Российской Федерации
            <span class="regions-count">({{ total() }})</span>
          </button>
          <tui-expand>
            <app-regions-export></app-regions-export>  
            <table tuiTable>
              <thead>
                <tr>
                  <th tuiTh>№</th>
                  <th tuiTh>Код</th>
                  <th tuiTh>Наименование</th>
                  <th tuiTh>Кратко</th>
                  <th tuiTh>Тип</th>
                  <th tuiTh>Активен</th>
                </tr>
              </thead>
              <tbody tuiTbody>
                @for (row of regions(); track row.id) {
                  <tr>
                    <td tuiTd>{{ row.sort_order ?? '—' }}</td>
                    <td tuiTd><code>{{ row.code }}</code></td>
                    <td tuiTd>{{ row.name_ru }}</td>
                    <td tuiTd>{{ row.name_short_ru ?? '—' }}</td>
                    <td tuiTd>{{ row.region_type ?? '—' }}</td>
                    <td tuiTd>{{ activeLabel(row.is_active) }}</td>
                  </tr>
                }
              </tbody>
            </table>
          </tui-expand>
  </tui-accordion>
</section>
